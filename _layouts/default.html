<!DOCTYPE html>
<html lang="en">

  {% include head.html %}

  <body>
    <nav class="nav">
      <div class="nav-container">
        <a href="{{ site.baseurl }}/">
          <h2 class="nav-title">{{ site.title }}</h2>
        </a>
        <ul class="nav-social-icons">
          <li>
            <button id="search-toggle" class="search-toggle" aria-label="Search">
              <i class="fas fa-search"></i>
            </button>
          </li>
          <li>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
              <i class="fas fa-moon"></i>
            </button>
          </li>
        </ul>
      </div>
    </nav>
    
      <nav class="nav-secondary">
        <div class="nav-container">
          <ul class="nav-menu">
            <li><a href="{{ site.baseurl }}/">Home</a></li>
            <li><a href="{{ site.baseurl }}/about/">About</a></li>
            <li><a href="{{ site.baseurl }}/categories/">Categories</a></li>
          </ul>
        </div>
      </nav>    <main>
      {{ content }}
    </main>

    <footer>
      <span>
        &copy; <time datetime="{{ site.time }}">{{ site.time | date: '%Y' }}</time> {{ site.author.name }}. Powered by Jekyll and <a href="#">Rain</a> theme.
      </span>
    </footer>
    
    <script src="{{ "/assets/js/theme-toggle.js" | relative_url }}" defer></script>
    <script src="{{ "/assets/js/search.js" | relative_url }}" defer></script>
  </body>
</html>
